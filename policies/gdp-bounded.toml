# ===================================================================
# GDP Bounded Execution Policy (v2.0)
#
# Install at:
#   ~/.gemini/policies/gdp-bounded.toml
#   or .gemini/policies/gdp-bounded.toml
#
# Workspace-level .gemini/policies is intentionally not relied upon.
# ===================================================================

# -------------------------------------------------------------------
# PLAN MODE: safe observation and verification
# -------------------------------------------------------------------

[[rule]]
toolName = "run_shell_command"
commandPrefix = [
  "git status",
  "git diff",
  "git log",
  "git show",
  "git rev-parse"
]
decision = "allow"
priority = 300
modes = ["plan", "default", "autoEdit"]

[[rule]]
toolName = "run_shell_command"
commandPrefix = [
  "rg ",
  "python -m pytest",
  "python3 -m pytest",
  "python -m unittest",
  "python3 -m unittest",
  "pytest",
  "npm test",
  "npm run test",
  "npm run lint",
  "npm run typecheck",
  "pnpm test",
  "pnpm lint",
  "pnpm typecheck"
]
decision = "allow"
priority = 280
modes = ["default", "autoEdit"]


# -------------------------------------------------------------------
# GDP LOCAL CONTROL PLANE
#
# GDP server remains the real effect/authority gate.
# The model is allowed to call it; GDP decides whether the effect
# is legal, current, fenced, reviewed, idempotent and executable.
# -------------------------------------------------------------------

[[rule]]
mcpName = "gdp"
decision = "allow"
priority = 500


# Hosted/global GDP has wider reach: keep explicit review.
[[rule]]
mcpName = "gdp-global"
decision = "ask_user"
priority = 550


# In plan mode, any MCP tool explicitly marked read-only may run.
[[rule]]
toolName = "*"
mcpName = "*"
toolAnnotations = { readOnlyHint = true }
decision = "allow"
priority = 200
modes = ["plan"]


# -------------------------------------------------------------------
# DIRECT WRITE PATHS
#
# Prefer GDP transaction/evidence surfaces over blind local mutation.
# -------------------------------------------------------------------

[[rule]]
toolName = ["write_file", "replace"]
decision = "ask_user"
priority = 350


# -------------------------------------------------------------------
# GIT MUTATION
# -------------------------------------------------------------------

[[rule]]
toolName = "run_shell_command"
commandRegex = "git (add|commit|push|reset|clean|restore|checkout|switch)"
decision = "deny"
priority = 800
denyMessage = "Direct Git mutation is fenced. Route publication/mutation through GDP so repository preconditions, evidence and reconciliation remain auditable."


# -------------------------------------------------------------------
# DESTRUCTIVE / PRIVILEGE ESCALATION
# -------------------------------------------------------------------

[[rule]]
toolName = "run_shell_command"
commandRegex = "(sudo|su |rm -rf|del /f|rmdir /s|format |diskpart)"
decision = "deny"
priority = 950
denyMessage = "Privileged or destructive host execution is outside the autonomous delegation envelope."


[[rule]]
toolName = "run_shell_command"
commandRegex = "(powershell|pwsh).*ExecutionPolicy.*Bypass"
decision = "deny"
priority = 950
denyMessage = "ExecutionPolicy Bypass is not part of the GDP bounded execution path."


# -------------------------------------------------------------------
# DEPENDENCY / NETWORK MUTATION
# -------------------------------------------------------------------

[[rule]]
toolName = "run_shell_command"
commandRegex = "(npm|pnpm|yarn) (install|add|remove|update)"
decision = "ask_user"
priority = 500

[[rule]]
toolName = "run_shell_command"
commandRegex = "(pip|pip3|python -m pip|python3 -m pip) install"
decision = "ask_user"
priority = 500


# -------------------------------------------------------------------
# CATCH-ALL MCP
# -------------------------------------------------------------------

[[rule]]
toolName = "*"
mcpName = "*"
decision = "ask_user"
priority = 50
